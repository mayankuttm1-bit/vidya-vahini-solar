<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Sun Energy Radiant Gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Solar Cell Silicon Blue Gradient -->
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Clean Tech Emerald Gradient -->
    <linearGradient id="ecoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left: X=10 to 110, Y=10 to 110) -->
  <g transform="translate(15, 10)">
    <!-- Radiant Outer Sun Rays -->
    <circle cx="50" cy="50" r="42" stroke="url(#sunGradient)" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.6" />
    
    <!-- Sun Disc (Top Right Offset) -->
    <path d="M 32 30 A 28 28 0 0 1 78 54 A 32 32 0 0 0 32 30 Z" fill="url(#sunGradient)" filter="url(#solarGlow)" />
    <circle cx="62" cy="38" r="14" fill="url(#sunGradient)" />

    <!-- 3D Perspective Photovoltaic Solar Grid Panel -->
    <polygon points="18,72 56,58 86,66 44,88" fill="url(#panelGradient)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Solar Cell Grid Lines (Perspective Lat & Long) -->
    <!-- Transverse Grid -->
    <line x1="37" y1="65" x2="65" y2="77" stroke="#BAE6FD" stroke-width="1.2" opacity="0.75" />
    <line x1="27" y1="80" x2="71" y2="62" stroke="#BAE6FD" stroke-width="1.2" opacity="0.75" />
    <!-- Longitudinal Grid -->
    <line x1="31" y1="68" x2="49" y2="86" stroke="#7DD3FC" stroke-width="1" opacity="0.6" />
    <line x1="43" y1="64" x2="61" y2="82" stroke="#7DD3FC" stroke-width="1" opacity="0.6" />
    <line x1="68" y1="61" x2="77" y2="72" stroke="#7DD3FC" stroke-width="1" opacity="0.6" />

    <!-- Clean Tech Leaf / Energy Lightning Arc -->
    <path d="M 44 88 Q 30 76 38 60 Q 42 70 56 68 Z" fill="url(#ecoGradient)" />
    <!-- Lightning Flash Accent -->
    <polygon points="52,42 45,54 51,54 44,68 59,51 52,51" fill="#FEF08A" />
  </g>

  <!-- TYPOGRAPHY HIERARCHY (X=130 onwards) -->
  <g transform="translate(130, 24)">
    <!-- Primary Brand Title -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      VIDYA VAHINI
    </text>
    <text x="245" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="url(#sunGradient)" letter-spacing="1">
      SOLAR
    </text>

    <!-- Subtitle Line -->
    <text x="2" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="3.5">
      AGENCY • EPC CONTRACTOR
    </text>

    <!-- Legal Corporate Affiliation Badge -->
    <rect x="0" y="74" width="280" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="8" cy="84" r="3" fill="#10B981" />
    <text x="16" y="88" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" letter-spacing="0.8">
      A UNIT OF RISAENERGY PVT LTD (CIN: U35105UP)
    </text>
  </g>
</svg>
